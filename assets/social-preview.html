<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Robin James Waje — social preview artwork</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #999d9e;
        color: white;
        font-family: Arial, sans-serif;
      }
      .frame {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 48px 58px;
      }
      .brand {
        font-size: 20px;
        letter-spacing: -0.4px;
      }
      .portrait {
        position: absolute;
        width: 520px;
        height: auto;
        right: 12px;
        top: 35px;
      }
      .copy {
        position: absolute;
        left: 58px;
        top: 180px;
        z-index: 2;
      }
      .eyebrow {
        font-size: 13px;
        letter-spacing: 3px;
        margin-bottom: 22px;
      }
      h1 {
        font-size: 91px;
        font-weight: 400;
        line-height: 0.99;
        letter-spacing: -5px;
        margin: 0;
      }
      .role {
        font-size: 25px;
        margin-top: 25px;
      }
      .footer {
        position: absolute;
        bottom: 40px;
        left: 58px;
        font-size: 14px;
        letter-spacing: 1px;
      }
      .arrow {
        position: absolute;
        right: 60px;
        top: 43px;
        width: 55px;
        height: 55px;
        border-radius: 50%;
        background: #455ce9;
        display: grid;
        place-items: center;
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="brand">© Code by Robin</div>
      <img class="portrait" src="robin-smiling-800.webp" alt="" />
      <div class="copy">
        <div class="eyebrow">SELECTED WORK &amp; PROJECTS</div>
        <h1>Robin<br />James Waje</h1>
        <div class="role">Designer &amp; Developer</div>
      </div>
      <div class="footer">THOUGHTFUL DESIGN. PURPOSEFUL CODE.</div>
      <div class="arrow">↗</div>
    </div>
  </body>
</html>
